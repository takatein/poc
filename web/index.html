<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資料レビューシステム</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 1.5rem;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
        }
        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .upload-text {
            color: #666;
            margin-bottom: 0.5rem;
        }
        .upload-hint {
            color: #999;
            font-size: 0.9rem;
        }
        input[type="file"] {
            display: none;
        }
        .options {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .option-group {
            flex: 1;
            min-width: 200px;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }
        select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
        }
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
            margin-top: 1.5rem;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .file-info {
            background: #f0f2ff;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            display: none;
        }
        .file-info.show {
            display: block;
        }
        .file-name {
            font-weight: 600;
            color: #333;
        }
        .file-size {
            color: #666;
            font-size: 0.9rem;
        }
        .result {
            display: none;
        }
        .result.show {
            display: block;
        }
        .result h2 {
            color: #333;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .result-meta {
            background: #f8f9ff;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #666;
        }
        .review-content {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 1.5rem;
            white-space: pre-wrap;
            line-height: 1.6;
            max-height: 500px;
            overflow-y: auto;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 8px;
            padding: 1rem;
            color: #c00;
            margin-top: 1rem;
            display: none;
        }
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>資料レビューシステム</h1>

        <div class="card">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📄</div>
                <div class="upload-text">ファイルをドラッグ＆ドロップ</div>
                <div class="upload-hint">またはクリックしてファイルを選択</div>
                <input type="file" id="fileInput" accept=".txt,.md,.py,.js,.ts,.java,.go,.json,.yaml,.yml,.xml,.html,.css">
            </div>

            <div class="file-info" id="fileInfo">
                <div class="file-name" id="fileName"></div>
                <div class="file-size" id="fileSize"></div>
            </div>

            <div class="options">
                <div class="option-group">
                    <label for="docType">資料タイプ</label>
                    <select id="docType">
                        <option value="auto">自動判定</option>
                        <option value="general">一般</option>
                        <option value="technical">技術文書</option>
                        <option value="business">ビジネス文書</option>
                        <option value="design">デザイン文書</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-primary" id="reviewBtn" disabled>レビューを開始</button>

            <div class="error" id="error"></div>
        </div>

        <div class="card loading" id="loading">
            <div class="spinner"></div>
            <div>AIがレビュー中です...</div>
        </div>

        <div class="card result" id="result">
            <h2>📝 レビュー結果</h2>
            <div class="result-meta">
                <strong>ファイル:</strong> <span id="resultFileName"></span><br>
                <strong>タイプ:</strong> <span id="resultDocType"></span>
            </div>
            <div class="review-content" id="reviewContent"></div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const docType = document.getElementById('docType');
        const reviewBtn = document.getElementById('reviewBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const error = document.getElementById('error');

        let selectedFile = null;
        let base64Content = null;

        // ドラッグ＆ドロップ
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // クリックでファイル選択
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // ファイル処理
        function handleFile(file) {
            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.add('show');
            reviewBtn.disabled = false;
            error.classList.remove('show');

            // Base64に変換
            const reader = new FileReader();
            reader.onload = (e) => {
                // data:text/plain;base64, の部分を除去
                const dataUrl = e.target.result;
                base64Content = dataUrl.split(',')[1];
            };
            reader.readAsDataURL(file);
        }

        // ファイルサイズをフォーマット
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // レビュー実行
        reviewBtn.addEventListener('click', async () => {
            if (!selectedFile || !base64Content) return;

            error.classList.remove('show');
            result.classList.remove('show');
            loading.classList.add('show');
            reviewBtn.disabled = true;

            try {
                const response = await fetch('/api/review', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        base64_content: base64Content,
                        filename: selectedFile.name,
                        document_type: docType.value === 'auto' ? 'general' : docType.value,
                    }),
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || 'レビューに失敗しました');
                }

                const data = await response.json();

                document.getElementById('resultFileName').textContent = data.filename;
                document.getElementById('resultDocType').textContent = data.document_type;
                document.getElementById('reviewContent').textContent = data.review;

                result.classList.add('show');
            } catch (err) {
                error.textContent = err.message;
                error.classList.add('show');
            } finally {
                loading.classList.remove('show');
                reviewBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
